<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX v4.4 | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background-color: #050507; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(15, 17, 26, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        select option { background: #0f111a; color: white; }
    </style>
</head>
<body class="min-h-screen">

    <div id="auth-overlay" class="fixed inset-0 z-[100] bg-black flex items-center justify-center p-6">
        <div class="max-w-md w-full glass p-8 rounded-3xl text-center">
            <h1 class="text-3xl font-black text-cyan-400 mb-2 italic">MATRIX v4.4</h1>
            <input type="password" id="admin-pass" placeholder="Enter System Password" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-4 text-center outline-none focus:border-cyan-500 transition">
            <button onclick="checkAuth()" class="w-full bg-cyan-500 text-black font-black py-4 rounded-2xl hover:bg-cyan-400 transition">ACCESS SYSTEM</button>
            <p id="auth-error" class="text-red-500 text-xs mt-4 hidden">Access Denied</p>
        </div>
    </div>

    <div id="main-app" class="hidden p-4 md:p-8">
        <div class="max-w-7xl mx-auto">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
                <div>
                    <h1 class="text-4xl font-black text-cyan-400 tracking-tighter">MATRIX <span class="text-white/20 text-xl font-medium italic">v4.4</span></h1>
                </div>
                <div class="flex gap-3">
                    <button onclick="openModal()" class="bg-blue-600 px-5 py-2.5 rounded-xl font-bold text-sm">+ NEW TEACHER</button>
                    <button onclick="location.reload()" class="p-2.5 bg-slate-900 rounded-xl border border-slate-800 text-gray-500 font-bold text-xs">LOGOUT</button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-5 glass rounded-3xl p-6 h-[75vh] flex flex-col">
                    <h3 class="text-lg font-black text-gray-300 mb-6">STAFF DIRECTORY</h3>
                    <div id="staff-list" class="space-y-3 overflow-y-auto custom-scroll pr-2 flex-grow"></div>
                </div>
                <div class="lg:col-span-7 glass rounded-3xl p-6 h-[75vh] flex flex-col border-cyan-900/20">
                    <h3 class="text-lg font-black text-cyan-400 mb-6">LIVE AI SUGGESTIONS</h3>
                    <div id="ai-list" class="space-y-4 overflow-y-auto custom-scroll pr-2 flex-grow"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass w-full max-w-2xl rounded-3xl p-8 max-h-[90vh] overflow-y-auto border-white/10">
            <h2 id="modal-title" class="text-2xl font-black text-cyan-400 mb-6 uppercase">Faculty Record</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <input type="text" id="t-name" placeholder="Name" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl">
                <select id="t-wing" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl"><option>Senior</option><option>Primary</option></select>
            </div>
            <div class="flex justify-between items-center mb-4">
                <h4 class="text-xs font-black text-gray-500 uppercase">Routine (Class / Sec / Subject)</h4>
                <button onclick="addScheduleRow()" class="text-cyan-500 text-xs font-bold">+ ADD SLOT</button>
            </div>
            <div id="schedule-container" class="space-y-2"></div>
            <div class="flex gap-4 mt-10">
                <button onclick="saveTeacher()" class="flex-grow bg-cyan-500 py-4 rounded-2xl font-black text-black">SAVE TO CLOUD</button>
                <button onclick="closeModal()" class="bg-slate-800 px-8 rounded-2xl font-bold">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://cfxobkfkhlirxepxvxjr.supabase.co'; 
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmeG9ia2ZraGxpcnhlcHh2eGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTI2NDUsImV4cCI6MjA5Mjg4ODY0NX0.spKXqpRScu3U7uiMnoA0iEJkiLf68RxGZya07WRlakg';
        const _db = supabase.createClient(SB_URL, SB_KEY);
        const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const today = days[new Date().getDay() - 1] || 'Monday';
        let editingTeacherId = null;

        function checkAuth() {
            if (document.getElementById('admin-pass').value === 'admin123') {
                document.getElementById('auth-overlay').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                refresh();
            } else { document.getElementById('auth-error').classList.remove('hidden'); }
        }

        async function refresh() {
            const { data: teachers } = await _db.from('teachers').select('*').order('name');
            renderStaff(teachers || []);
            processAI(teachers || []);
        }

        function renderStaff(list) {
            document.getElementById('staff-list').innerHTML = list.map(t => `
                <div class="bg-slate-900/40 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                    <div>
                        <div class="font-bold text-gray-200">${t.name}</div>
                        <div class="text-[10px] font-bold text-slate-500 uppercase mt-1">${t.wing}</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openEditModal('${t.id}')" class="px-3 py-2 bg-slate-800 rounded-lg text-[10px] font-bold text-cyan-400">EDIT</button>
                        <button onclick="toggleAbsence('${t.id}', ${t.is_absent})" class="px-3 py-2 rounded-lg text-[10px] font-black ${t.is_absent ? 'bg-red-500/20 text-red-500' : 'bg-slate-800 text-slate-500'}">
                            ${t.is_absent ? 'ABSENT' : 'PRESENT'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function openEditModal(id) {
            editingTeacherId = id;
            const { data: t } = await _db.from('teachers').select('*').eq('id', id).single();
            document.getElementById('t-name').value = t.name;
            document.getElementById('t-wing').value = t.wing;
            
            document.getElementById('schedule-container').innerHTML = '';
            const { data: busy } = await _db.from('teacher_schedule').select('*').eq('teacher_id', id);
            busy?.forEach(r => addScheduleRow(r.day_of_week, r.period_number, 'busy', r.class_name, r.section, r.subject));
            document.getElementById('modal').classList.remove('hidden');
        }

        function addScheduleRow(d='Monday', p='', type='busy', c='', s='', sub='') {
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-slate-800/20 p-2 rounded-xl border border-slate-800";
            div.innerHTML = `
                <select class="r-day bg-slate-900 text-[10px] p-2 rounded outline-none">${days.map(day => `<option ${day===d?'selected':''}>${day}</option>`).join('')}</select>
                <input type="number" value="${p}" class="r-prd w-10 bg-slate-900 p-2 rounded text-center text-[10px]" placeholder="P">
                <input type="text" value="${c}" class="r-cls w-12 bg-slate-900 p-2 rounded text-[10px]" placeholder="Cls">
                <input type="text" value="${s}" class="r-sec w-10 bg-slate-900 p-2 rounded text-[10px]" placeholder="Sec">
                <input type="text" value="${sub}" class="r-sub w-16 bg-slate-900 p-2 rounded text-[10px]" placeholder="Sub">
                <button onclick="this.parentElement.remove()" class="text-red-500 font-bold">×</button>
            `;
            document.getElementById('schedule-container').appendChild(div);
        }

        async function saveTeacher() {
            const name = document.getElementById('t-name').value;
            const wing = document.getElementById('t-wing').value;
            
            if(editingTeacherId) {
                await _db.from('teachers').update({ name, wing }).eq('id', editingTeacherId);
                await _db.from('teacher_schedule').delete().eq('teacher_id', editingTeacherId);
            } else {
                const { data: newT } = await _db.from('teachers').insert({ name, wing }).select().single();
                editingTeacherId = newT.id;
            }

            const rows = document.querySelectorAll('#schedule-container > div');
            for(let row of rows) {
                await _db.from('teacher_schedule').insert({ 
                    teacher_id: editingTeacherId, 
                    day_of_week: row.querySelector('.r-day').value, 
                    period_number: row.querySelector('.r-prd').value, 
                    class_name: row.querySelector('.r-cls').value,
                    section: row.querySelector('.r-sec').value,
                    subject: row.querySelector('.r-sub').value
                });
            }
            closeModal(); refresh();
        }

        async function processAI(all) {
            const container = document.getElementById('ai-list');
            const absentees = all.filter(t => t.is_absent);
            let html = "";
            for (let abs of absentees) {
                const { data: schedule } = await _db.from('teacher_schedule').select('*').eq('teacher_id', abs.id).eq('day_of_week', today);
                for (let slot of (schedule || [])) {
                    html += `
                        <div class="bg-slate-900/60 p-5 rounded-3xl border border-slate-800">
                            <span class="text-[10px] text-cyan-400 font-black">PERIOD ${slot.period_number}</span>
                            <h4 class="text-lg font-black">${slot.class_name}-${slot.section}</h4>
                            <p class="text-xs text-slate-400 uppercase">${slot.subject} | Absent: ${abs.name}</p>
                        </div>`;
                }
            }
            container.innerHTML = html || `<p class="text-slate-600">No current absences.</p>`;
        }

        async function toggleAbsence(id, cur) { await _db.from('teachers').update({ is_absent: !cur }).eq('id', id); refresh(); }
        function openModal() { editingTeacherId = null; document.getElementById('modal').classList.remove('hidden'); addScheduleRow(); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    </script>
</body>
</html>
