<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX | GGPS Dhanbad AI v3.6</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #050507; 
            --card: #0f111a; 
            --primary: #0070f3; 
            --accent: #00dfd8; 
            --text: #ffffff; 
            --danger: #ff0055; 
            --success: #00ff88; 
        }
        
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            overflow-x: hidden; 
        }

        .grid-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-image: linear-gradient(rgba(0, 223, 216, 0.03) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 223, 216, 0.03) 1px, transparent 1px); 
            background-size: 30px 30px; z-index: -1; 
        }

        #login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        #main-app { display: none; padding: 40px; max-width: 1400px; margin: 0 auto; }

        .glass { 
            background: rgba(15, 17, 26, 0.8); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 16px; 
            backdrop-filter: blur(10px); 
            padding: 25px; 
        }

        .grid { display: grid; grid-template-columns: 380px 1fr; gap: 30px; margin-top: 20px; }

        input, select { 
            background: #161925; border: 1px solid #2d314d; color: white; 
            padding: 12px; border-radius: 8px; margin-bottom: 10px; 
            width: 100%; box-sizing: border-box; font-family: inherit; 
        }

        .btn { 
            background: var(--primary); color: white; border: none; 
            padding: 12px 24px; border-radius: 8px; cursor: pointer; 
            font-weight: bold; transition: 0.3s; text-transform: uppercase; 
        }

        .btn:hover { background: var(--accent); color: black; box-shadow: 0 0 20px var(--accent); }

        .t-card { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; background: rgba(255,255,255,0.03); 
            border-radius: 12px; margin-bottom: 10px; border-left: 4px solid var(--primary); 
        }

        .status-pill { 
            padding: 6px 12px; border-radius: 20px; font-size: 11px; 
            font-weight: 800; cursor: pointer; border: none; min-width: 80px; 
        }

        .present { background: rgba(0, 255, 136, 0.1); color: var(--success); }
        .absent { background: rgba(255, 0, 85, 0.1); color: var(--danger); }

        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; 
        }

        .modal-content { 
            background: var(--card); width: 850px; max-height: 90vh; 
            overflow-y: auto; padding: 35px; border-radius: 20px; 
            border: 1px solid var(--primary); 
        }

        .row { display: flex; gap: 10px; align-items: center; }

        .arr-card { 
            background: #1a1c2e; padding: 20px; border-radius: 15px; 
            margin-bottom: 15px; border: 1px solid rgba(0, 223, 216, 0.2); 
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div id="login-screen">
        <div class="glass" style="width: 320px; text-align: center;">
            <h1 style="color: var(--accent); letter-spacing: -2px;">MATRIX</h1>
            <input type="password" id="auth-pass" placeholder="Admin Password">
            <button class="btn" style="width: 100%" onclick="unlock()">AUTHORIZE</button>
        </div>
    </div>

    <div id="main-app">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 id="day-display" style="color: var(--accent); margin:0;">GGPS AI</h1>
            <button class="btn" onclick="openModal()">+ REGISTER TEACHER</button>
        </div>
        <div class="grid">
            <div class="glass" style="height: 75vh; overflow-y: auto;">
                <h3 style="color: var(--primary); margin-top:0;">STAFF DIRECTORY</h3>
                <div id="staff-list"></div>
            </div>
            <div class="glass" style="height: 75vh; overflow-y: auto;">
                <h3 style="color: var(--primary); margin-top:0;">LIVE ARRANGEMENTS</h3>
                <div id="arr-list"></div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--accent); margin-top:0;">Register Master Schedule</h2>
            <div class="row">
                <input type="text" id="new-name" placeholder="Teacher Full Name">
                <select id="new-wing"><option value="Senior">Senior Wing</option><option value="Primary">Primary Wing</option></select>
            </div>
            <div class="row">
                <input type="text" id="new-subject" placeholder="Main Subject">
                <div style="display: flex; align-items: center; gap: 10px; background: #161925; padding: 10px; border-radius: 8px; flex: 1; margin-bottom: 10px;">
                    <input type="checkbox" id="can-sub" checked style="width: 20px; margin: 0;">
                    <label style="font-size: 11px; color: var(--accent); font-weight: bold;">AVAILABLE FOR SUBSTITUTION</label>
                </div>
            </div>
            <div class="row">
                <input type="text" id="new-ct-class" placeholder="CT Class">
                <input type="text" id="new-ct-sec" placeholder="CT Sec">
            </div>
            <div id="entry-container"></div>
            <button onclick="addEntryRow()" class="btn" style="background:none; border:1px dashed var(--success); width:100%; margin-top:10px;">+ ADD PERIOD</button>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="btn" style="flex: 2" onclick="saveTeacher()">SYNC TO CLOUD</button>
                <button class="btn" style="flex: 1; background: #334" onclick="closeModal()">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://cfxobkfkhlirxepxvxjr.supabase.co'; 
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmeG9ia2ZraGxpcnhlcHh2eGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTI2NDUsImV4cCI6MjA5Mjg4ODY0NX0.spKXqpRScu3U7uiMnoA0iEJkiLf68RxGZya07WRlakg'; 
        const _db = supabase.createClient(SB_URL, SB_KEY);
        const today = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];

        function unlock() {
            if(document.getElementById('auth-pass').value === 'admin123') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('day-display').innerText = today;
                refresh();
            } else { alert("ACCESS DENIED"); }
        }

        async function refresh() {
            const { data: t } = await _db.from('teachers').select('*').order('name');
            document.getElementById('staff-list').innerHTML = t.map(x => `
                <div class="t-card">
                    <div>
                        <div style="font-weight:bold">${x.name}</div>
                        <div style="font-size:9px; color:${x.can_take_arrangement ? 'var(--primary)' : 'var(--danger)'}">
                            ${x.wing} | ${x.can_take_arrangement ? 'DUTY: YES' : 'DUTY: NO'}
                        </div>
                    </div>
                    <button class="status-pill ${x.is_absent ? 'absent' : 'present'}" onclick="toggleStatus('${x.id}', ${x.is_absent})">
                        ${x.is_absent ? 'ABSENT' : 'PRESENT'}
                    </button>
                </div>`).join('');
            processAI(t || []);
        }

        async function toggleStatus(id, s) { 
            await _db.from('teachers').update({is_absent: !s}).eq('id', id); 
            refresh(); 
        }

        async function saveTeacher() {
            const name = document.getElementById('new-name').value;
            if(!name) return alert("Name is required");

            const { data: teacher, error } = await _db.from('teachers').insert([{ 
                name: name,
                wing: document.getElementById('new-wing').value,
                main_subject: document.getElementById('new-subject').value,
                ct_class: document.getElementById('new-ct-class').value,
                ct_section: document.getElementById('new-ct-sec').value,
                can_take_arrangement: document.getElementById('can-sub').checked,
                is_absent: false
            }]).select();

            if(error) return alert(error.message);
            const tid = teacher[0].id;

            for(let r of document.querySelectorAll('.schedule-row')) {
                const type = r.querySelector('.r-type').value;
                const prd = r.querySelector('.r-prd').value;
                const day = r.querySelector('.r-day').value;
                if(!prd) continue;

                if(type === 'busy') {
                    await _db.from('teacher_schedule').insert([{
                        teacher_id: tid, day_of_week: day, period_number: prd,
                        class_name: r.querySelector('.r-cls').value,
                        section: r.querySelector('.r-sec').value,
                        subject: r.querySelector('.r-sub').value
                    }]);
                } else { 
                    await _db.from('free_periods').insert([{
                        teacher_id: tid, day_of_week: day, period_number: prd
                    }]); 
                }
            }
            closeModal(); 
            refresh();
        }

        async function processAI(all) {
            const absents = all.filter(t => t.is_absent);
            let html = "";
            for(let t of absents) {
                const { data: slots } = await _db.from('teacher_schedule').select('*').eq('teacher_id', t.id).eq('day_of_week', today);
                for(let s of slots) {
                    const { data: f } = await _db.from('free_periods')
                        .select('teacher_id, teachers(name, is_absent, can_take_arrangement, wing)')
                        .eq('day_of_week', today)
                        .eq('period_number', s.period_number);
                    
                    // Logic: Must be present AND must be allowed to take arrangement
                    let available = f?.filter(x => x.teachers && !x.teachers.is_absent && x.teachers.can_take_arrangement) || [];
                    
                    // Priority: Same wing teachers first
                    available.sort((a, b) => a.teachers.wing === t.wing ? -1 : 1);
                    
                    const match = available[0];

                    html += `<div class="arr-card">
                        <span style="color:var(--accent)">PRD ${s.period_number} | ${s.class_name}-${s.section}</span><br>
                        <small>Absent: ${t.name}</small>
                        <div style="margin-top:10px; font-weight:bold; color:var(--success)">
                            SUGGESTION: ${match ? match.teachers.name : 'NO ELIGIBLE STAFF'}
                        </div>
                    </div>`;
                }
            }
            document.getElementById('arr-list').innerHTML = html || "<div style='opacity:0.5; text-align:center; padding-top:50px;'>ALL SECURE</div>";
        }

        function addEntryRow() {
            const div = document.createElement('div'); div.className = "row schedule-row";
            div.innerHTML = `
                <select class="r-day"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select>
                <input type="number" class="r-prd" placeholder="Prd" style="width:65px">
                <select class="r-type" style="width:95px"><option value="busy">BUSY</option><option value="free">FREE</option></select>
                <input type="text" class="r-cls" placeholder="Cls" style="width:55px"><input type="text" class="r-sec" placeholder="Sec" style="width:45px"><input type="text" class="r-sub" placeholder="Sub">`;
            document.getElementById('entry-container').appendChild(div);
        }
        function openModal() { document.getElementById('modal').style.display='flex'; addEntryRow(); }
        function closeModal() { document.getElementById('modal').style.display='none'; document.getElementById('entry-container').innerHTML=''; }
    </script>
</body>
</html>
