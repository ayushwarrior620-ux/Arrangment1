<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX | Proxy Management System</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body {
            background: #0f172a; /* Slate 900 */
            color: #f8fafc;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        /* Glassmorphism Classes */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .glass-input:focus {
            outline: none;
            border-color: #22d3ee; /* Cyan 400 */
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, 0.5); border-radius: 4px; }
    </style>
</head>
<body class="relative">

    <!-- Authentication Overlay -->
    <div id="auth-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-90 backdrop-blur-md">
        <div class="glass p-8 rounded-2xl w-full max-w-sm text-center">
            <h1 class="text-3xl font-bold tracking-widest text-cyan-400 mb-6">MATRIX</h1>
            <p class="text-sm text-gray-400 mb-4">System Locked</p>
            <input type="password" id="auth-password" placeholder="Enter password..." class="glass-input w-full p-3 rounded-lg mb-4 text-center">
            <button onclick="checkAuth()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Unlock System
            </button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden container mx-auto px-4 py-8 max-w-7xl">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 glass p-6 rounded-2xl">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">MATRIX</h1>
                <p class="text-gray-400 text-sm mt-1">School Staff Management & Proxy System</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-4">
                <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white py-2 px-4 rounded-lg flex items-center transition">
                    <span>Upload CSV</span>
                    <input type="file" id="csv-upload" accept=".csv" class="hidden" onchange="handleCSVUpload(event)">
                </label>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: AI Proxy Engine Action Items -->
            <div class="lg:col-span-1 space-y-6">
                <div class="glass p-6 rounded-2xl h-[calc(100vh-250px)] flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-cyan-400">Action Items</h2>
                        <button onclick="runProxyEngine()" class="text-xs bg-cyan-600 hover:bg-cyan-500 px-3 py-1 rounded text-white">Refresh</button>
                    </div>
                    <p class="text-sm text-gray-400 mb-4">Today's absent teacher proxies required.</p>
                    <div id="proxy-list" class="flex-1 overflow-y-auto space-y-3">
                        <!-- Proxy items injected here -->
                    </div>
                </div>
            </div>

            <!-- Right Column: Staff Directory -->
            <div class="lg:col-span-2">
                <div class="glass p-6 rounded-2xl h-[calc(100vh-250px)] flex flex-col">
                    <h2 class="text-xl font-bold mb-4 text-cyan-400">Staff Directory</h2>
                    <div class="overflow-x-auto flex-1">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-gray-400 text-sm border-b border-gray-700">
                                    <th class="pb-3 px-2">Name</th>
                                    <th class="pb-3 px-2">Wing</th>
                                    <th class="pb-3 px-2">CT Class</th>
                                    <th class="pb-3 px-2 text-center">Proxy Count</th>
                                    <th class="pb-3 px-2 text-center">Status</th>
                                    <th class="pb-3 px-2 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="staff-directory" class="text-sm">
                                <!-- Staff rows injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Teacher Editor Modal -->
    <div id="teacher-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-80 backdrop-blur-sm p-4">
        <div class="glass p-6 rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
            <h2 class="text-2xl font-bold text-cyan-400 mb-6">Teacher Editor</h2>
            
            <input type="hidden" id="edit-id">
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Name</label>
                    <input type="text" id="edit-name" class="glass-input w-full p-2 rounded">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Wing</label>
                    <input type="text" id="edit-wing" class="glass-input w-full p-2 rounded">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Class Teacher Of</label>
                    <input type="text" id="edit-ct" class="glass-input w-full p-2 rounded">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Proxy Eligibility</label>
                    <select id="edit-eligibility" class="glass-input w-full p-2 rounded">
                        <option value="true">True</option>
                        <option value="false">False</option>
                    </select>
                </div>
            </div>

            <hr class="border-gray-700 mb-6">
            
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Dynamic Routine</h3>
                <button onclick="addScheduleRow()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm text-cyan-400 border border-cyan-800">+ Add Row</button>
            </div>
            
            <!-- Schedule Rows Container -->
            <div id="schedule-container" class="space-y-3 mb-6">
                <!-- Rows injected here -->
            </div>

            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-6 py-2 rounded glass hover:bg-white/10 transition">Cancel</button>
                <button onclick="saveTeacherData()" class="px-6 py-2 rounded bg-cyan-600 hover:bg-cyan-500 text-white font-bold transition">Save Routine & Data</button>
            </div>
        </div>
    </div>

    <!-- MAIN LOGIC -->
    <script>
        // --- 1. INITIALIZATION & AUTH ---
        const supabaseUrl = 'https://cfxobkfkhlirxepxvxjr.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmeG9ia2ZraGxpcnhlcHh2eGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTI2NDUsImV4cCI6MjA5Mjg4ODY0NX0.spKXqpRScu3U7uiMnoA0iEJkiLf68RxGZya07WRlakg';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        function checkAuth() {
            const pwd = document.getElementById('auth-password').value;
            if (pwd === 'admin123') {
                document.getElementById('auth-overlay').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                initSystem();
            } else {
                alert('Invalid password');
            }
        }

        async function initSystem() {
            await fetchTeachers();
            await runProxyEngine();
        }

        // --- 2. STAFF DIRECTORY LOGIC ---
        let globalTeachers = [];

        async function fetchTeachers() {
            const { data, error } = await supabase.from('teachers').select('*').order('name');
            if (error) return console.error('Error fetching teachers', error);
            globalTeachers = data;
            renderTeachers();
        }

        function renderTeachers() {
            const tbody = document.getElementById('staff-directory');
            tbody.innerHTML = '';
            globalTeachers.forEach(t => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-800 hover:bg-white hover:bg-opacity-5 transition';
                tr.innerHTML = `
                    <td class="py-3 px-2">${t.name}</td>
                    <td class="py-3 px-2">${t.wing || '-'}</td>
                    <td class="py-3 px-2">${t.ct_class || '-'}</td>
                    <td class="py-3 px-2 text-center text-cyan-400 font-bold">${t.proxy_count}</td>
                    <td class="py-3 px-2 text-center">
                        <button onclick="toggleAbsent('${t.id}', ${t.is_absent})" class="px-3 py-1 rounded text-xs font-bold ${t.is_absent ? 'bg-red-500/20 text-red-400 border border-red-500/50' : 'bg-green-500/20 text-green-400 border border-green-500/50'}">
                            ${t.is_absent ? 'ABSENT' : 'PRESENT'}
                        </button>
                    </td>
                    <td class="py-3 px-2 text-right">
                        <button onclick="openModal('${t.id}')" class="text-cyan-400 hover:text-cyan-300 underline text-xs">Edit Routine</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function toggleAbsent(id, currentState) {
            await supabase.from('teachers').update({ is_absent: !currentState }).eq('id', id);
            await fetchTeachers();
            await runProxyEngine(); // Refresh proxy needs immediately
        }

        // --- 3. DYNAMIC ROUTINE & MODAL LOGIC ---
        async function openModal(teacherId) {
            const teacher = globalTeachers.find(t => t.id === teacherId);
            if (!teacher) return;

            document.getElementById('edit-id').value = teacher.id;
            document.getElementById('edit-name').value = teacher.name || '';
            document.getElementById('edit-wing').value = teacher.wing || '';
            document.getElementById('edit-ct').value = teacher.ct_class || '';
            document.getElementById('edit-eligibility').value = teacher.can_take_proxy ? 'true' : 'false';

            document.getElementById('schedule-container').innerHTML = '';

            // Fetch existing schedules and free periods
            const [scheduleRes, freeRes] = await Promise.all([
                supabase.from('teacher_schedule').select('*').eq('teacher_id', teacher.id),
                supabase.from('free_periods').select('*').eq('teacher_id', teacher.id)
            ]);

            const schedules = scheduleRes.data || [];
            const freePeriods = freeRes.data || [];

            schedules.forEach(s => addScheduleRow(s.day_of_week, s.period_number, 'Busy', s.class_name, s.section, s.subject));
            freePeriods.forEach(f => addScheduleRow(f.day_of_week, f.period_number, 'Free', '', '', ''));

            document.getElementById('teacher-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('teacher-modal').classList.add('hidden');
        }

        // CONSTRAINT MET: Maintain modular addScheduleRow function, never remove Section/Subject inputs.
        function addScheduleRow(day = 'Monday', period = 1, type = 'Busy', className = '', section = '', subject = '') {
            const container = document.getElementById('schedule-container');
            const row = document.createElement('div');
            row.className = 'schedule-row flex flex-wrap md:flex-nowrap gap-2 items-center bg-gray-800/50 p-3 rounded border border-gray-700';
            
            row.innerHTML = `
                <select class="row-day glass-input p-2 rounded text-sm w-full md:w-auto"><option value="Monday" ${day==='Monday'?'selected':''}>Monday</option><option value="Tuesday" ${day==='Tuesday'?'selected':''}>Tuesday</option><option value="Wednesday" ${day==='Wednesday'?'selected':''}>Wednesday</option><option value="Thursday" ${day==='Thursday'?'selected':''}>Thursday</option><option value="Friday" ${day==='Friday'?'selected':''}>Friday</option><option value="Saturday" ${day==='Saturday'?'selected':''}>Saturday</option></select>
                <input type="number" class="row-period glass-input w-full md:w-20 p-2 rounded text-sm" placeholder="Period" value="${period}">
                <select class="row-type glass-input p-2 rounded text-sm w-full md:w-auto"><option value="Busy" ${type==='Busy'?'selected':''}>Busy</option><option value="Free" ${type==='Free'?'selected':''}>Free</option></select>
                <input type="text" class="row-class glass-input w-full md:w-24 p-2 rounded text-sm" placeholder="Class" value="${className}">
                <input type="text" class="row-section glass-input w-full md:w-24 p-2 rounded text-sm" placeholder="Section" value="${section}">
                <input type="text" class="row-subject glass-input flex-1 p-2 rounded text-sm" placeholder="Subject" value="${subject}">
                <button onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 font-bold px-2">&times;</button>
            `;
            container.appendChild(row);
        }

        async function saveTeacherData() {
            const id = document.getElementById('edit-id').value;
            
            // 1. Update Profile
            await supabase.from('teachers').update({
                name: document.getElementById('edit-name').value,
                wing: document.getElementById('edit-wing').value,
                ct_class: document.getElementById('edit-ct').value,
                can_take_proxy: document.getElementById('edit-eligibility').value === 'true'
            }).eq('id', id);

            // 2. Delete Old Routines
            await Promise.all([
                supabase.from('teacher_schedule').delete().eq('teacher_id', id),
                supabase.from('free_periods').delete().eq('teacher_id', id)
            ]);

            // 3. Batch Insert New Routines
            const rows = document.querySelectorAll('.schedule-row');
            const schedules = [];
            const freePeriods = [];

            rows.forEach(row => {
                const day = row.querySelector('.row-day').value;
                const period = parseInt(row.querySelector('.row-period').value);
                const type = row.querySelector('.row-type').value;
                const cls = row.querySelector('.row-class').value;
                const sec = row.querySelector('.row-section').value;
                const sub = row.querySelector('.row-subject').value;

                if (type === 'Busy') {
                    schedules.push({ teacher_id: id, day_of_week: day, period_number: period, class_name: cls, section: sec, subject: sub });
                } else {
                    freePeriods.push({ teacher_id: id, day_of_week: day, period_number: period });
                }
            });

            if (schedules.length > 0) await supabase.from('teacher_schedule').insert(schedules);
            if (freePeriods.length > 0) await supabase.from('free_periods').insert(freePeriods);

            closeModal();
            await fetchTeachers();
            await runProxyEngine();
        }

        // --- 4. AI PROXY ENGINE ---
        async function runProxyEngine() {
            const listContainer = document.getElementById('proxy-list');
            listContainer.innerHTML = '<p class="text-gray-400 text-sm">Analyzing schedules...</p>';

            // Get Current Day (Mocked to Monday if Sunday, adjust as needed)
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            let currentDay = days[new Date().getDay()];
            if (currentDay === 'Sunday') currentDay = 'Monday'; // Fallback for testing

            // Filter Absent Teachers
            const absentTeachers = globalTeachers.filter(t => t.is_absent);
            if (absentTeachers.length === 0) {
                listContainer.innerHTML = '<div class="p-4 bg-green-500/10 border border-green-500/20 text-green-400 rounded">No absences marked today.</div>';
                return;
            }

            const absentIds = absentTeachers.map(t => t.id);

            // Fetch Schedule for Absent Teachers for Current Day
            const { data: missingClasses, error } = await supabase
                .from('teacher_schedule')
                .select('*, teachers(name)')
                .in('teacher_id', absentIds)
                .eq('day_of_week', currentDay)
                .order('period_number', { ascending: true });

            if (error) return console.error("Proxy Engine Error:", error);

            if (!missingClasses || missingClasses.length === 0) {
                listContainer.innerHTML = '<div class="p-4 bg-gray-800/50 rounded text-gray-400 text-sm">Absent teachers have no scheduled classes today.</div>';
                return;
            }

            listContainer.innerHTML = '';
            
            // Format Action Items: [Period Number], [Class-Section], [Subject], [Name]
            missingClasses.forEach(item => {
                const div = document.createElement('div');
                div.className = 'p-3 bg-red-900/20 border border-red-500/20 rounded-lg flex flex-col gap-1';
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-xs font-bold bg-red-500 text-white px-2 py-0.5 rounded">Period ${item.period_number}</span>
                        <span class="text-xs text-gray-400">${item.teachers.name}</span>
                    </div>
                    <div class="font-bold text-lg text-gray-100">${item.class_name}-${item.section}</div>
                    <div class="text-sm text-cyan-300 font-medium">${item.subject}</div>
                `;
                listContainer.appendChild(div);
            });
        }

        // --- 5. CSV INTEGRATION (PapaParse) ---
        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async function(results) {
                    const data = results.data.map(row => ({
                        name: row.name || row.Name,
                        wing: row.wing || row.Wing,
                        ct_class: row.ct_class || row.CT_Class,
                        can_take_proxy: row.can_take_proxy === 'true' || row.can_take_proxy === 'TRUE',
                        is_absent: false
                    }));
                    
                    if (data.length > 0) {
                        await supabase.from('teachers').insert(data);
                        alert(`Successfully imported ${data.length} teachers!`);
                        await fetchTeachers();
                    }
                }
            });
        }
    </script>
</body>
</html>
