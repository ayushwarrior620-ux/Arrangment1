<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX | GGPS Dhanbad AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background-color: #050507; color: white; }
        .glass { background: rgba(15, 17, 26, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div id="login-screen" class="fixed inset-0 flex items-center justify-center z-50">
        <div class="glass p-8 rounded-2xl w-80 text-center shadow-2xl">
            <h1 class="text-3xl font-bold text-cyan-400 mb-6">MATRIX</h1>
            <input type="password" id="auth-pass" placeholder="Admin Password" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg mb-4 text-white">
            <button onclick="unlock()" class="w-full bg-blue-600 py-3 rounded-lg font-bold hover:bg-cyan-500 transition">AUTHORIZE</button>
        </div>
    </div>

    <div id="main-app" class="hidden max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-cyan-400">MATRIX v3.6</h1>
            <div class="flex gap-3">
                <button onclick="openModal()" class="bg-blue-600 px-6 py-2 rounded-lg font-bold hover:bg-cyan-500">+ ADD TEACHER</button>
                <button onclick="document.getElementById('csv-file').click()" class="bg-slate-700 px-6 py-2 rounded-lg font-bold hover:bg-slate-600">IMPORT CSV</button>
                <input type="file" id="csv-file" accept=".csv" class="hidden" onchange="uploadCSV(event)">
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass p-6 rounded-2xl h-[70vh] overflow-y-auto">
                <h3 class="text-xl font-bold text-blue-400 mb-4">STAFF DIRECTORY</h3>
                <div id="staff-list"></div>
            </div>
            <div class="glass p-6 rounded-2xl h-[70vh] overflow-y-auto">
                <h3 class="text-xl font-bold text-cyan-400 mb-4">LIVE ARRANGEMENTS</h3>
                <div id="arr-list"></div>
            </div>
        </div>
    </div>

    <script>
        // REPLACE THESE WITH YOUR KEYS
        const SB_URL = 'https://cfxobkfkhlirxepxvxjr.supabase.co'; 
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmeG9ia2ZraGxpcnhlcHh2eGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTI2NDUsImV4cCI6MjA5Mjg4ODY0NX0.spKXqpRScu3U7uiMnoA0iEJkiLf68RxGZya07WRlakg'; 
        const _db = supabase.createClient(SB_URL, SB_KEY);
        const today = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];

        function unlock() { 
            if(document.getElementById('auth-pass').value === 'admin123') { 
                document.getElementById('login-screen').classList.add('hidden'); 
                document.getElementById('main-app').classList.remove('hidden'); 
                refresh(); 
            } else { alert("ACCESS DENIED"); } 
        }

        async function uploadCSV(event) {
            const file = event.target.files[0];
            Papa.parse(file, { header: true, complete: async (results) => {
                const { error } = await _db.from('teachers').insert(results.data);
                if(error) alert("Error: " + error.message); else { alert("Sync Complete!"); refresh(); }
            }});
        }

        async function refresh() {
            const { data: t } = await _db.from('teachers').select('*').order('name');
            document.getElementById('staff-list').innerHTML = t.map(x => `
                <div class="glass p-4 rounded-xl mb-3 flex justify-between items-center border-l-4 ${x.can_take_arrangement ? 'border-blue-500' : 'border-red-500'}">
                    <div><div class="font-bold">${x.name}</div><div class="text-[10px] text-gray-400">${x.wing}</div></div>
                    <button onclick="toggleStatus('${x.id}', ${x.is_absent})" class="px-4 py-1 rounded-full text-xs font-bold ${x.is_absent ? 'bg-red-500/20 text-red-500' : 'bg-green-500/20 text-green-500'}">
                        ${x.is_absent ? 'ABSENT' : 'PRESENT'}
                    </button>
                </div>`).join('');
            processAI(t || []);
        }

        async function toggleStatus(id, s) { await _db.from('teachers').update({is_absent: !s}).eq('id', id); refresh(); }

        async function processAI(all) {
            const absents = all.filter(t => t.is_absent);
            let html = "";
            for(let t of absents) {
                const { data: slots } = await _db.from('teacher_schedule').select('*').eq('teacher_id', t.id).eq('day_of_week', today);
                for(let s of slots) {
                    const { data: f } = await _db.from('free_periods').select('teacher_id, teachers(name, is_absent, can_take_arrangement, wing)').eq('day_of_week', today).eq('period_number', s.period_number);
                    let available = f?.filter(x => x.teachers && !x.teachers.is_absent && x.teachers.can_take_arrangement) || [];
                    available.sort((a, b) => a.teachers.wing === t.wing ? -1 : 1);
                    const match = available[0];
                    html += `<div class="glass p-4 rounded-xl mb-3 border-cyan-900/50">
                        <div class="text-cyan-400 text-sm font-bold">PRD ${s.period_number} | ${s.class_name}-${s.section}</div>
                        <div class="text-xs text-gray-400">Absent: ${t.name}</div>
                        <div class="font-bold text-green-400 mt-2">SUGGESTION: ${match ? match.teachers.name : 'NO ELIGIBLE STAFF'}</div>
                    </div>`;
                }
            }
            document.getElementById('arr-list').innerHTML = html || "<div class='text-center text-gray-600 mt-10'>ALL SECURE</div>";
        }
    </script>
</body>
</html>
