<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX v4.1 | Secure Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background-color: #050507; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(15, 17, 26, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        select option { background: #0f111a; color: white; } /* Fix for the white dropdown issue */
    </style>
</head>
<body class="min-h-screen">

    <div id="auth-overlay" class="fixed inset-0 z-[100] bg-black flex items-center justify-center p-6">
        <div class="max-w-md w-full glass p-8 rounded-3xl text-center">
            <h1 class="text-3xl font-black text-cyan-400 mb-2 italic">MATRIX v4.1</h1>
            <p class="text-gray-500 text-xs font-bold mb-8 uppercase tracking-widest">Authorized Personnel Only</p>
            <input type="password" id="admin-pass" placeholder="Enter System Password" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-4 text-center outline-none focus:border-cyan-500 transition">
            <button onclick="checkAuth()" class="w-full bg-cyan-500 text-black font-black py-4 rounded-2xl hover:bg-cyan-400 transition shadow-lg shadow-cyan-500/20">ACCESS SYSTEM</button>
            <p id="auth-error" class="text-red-500 text-xs mt-4 hidden">Access Denied: Incorrect Password</p>
        </div>
    </div>

    <div id="main-app" class="hidden p-4 md:p-8">
        <div class="max-w-7xl mx-auto">
            
            <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
                <div>
                    <h1 class="text-4xl font-black text-cyan-400 tracking-tighter">MATRIX <span class="text-white/20 text-xl font-medium italic">v4.1</span></h1>
                    <p class="text-gray-500 font-bold uppercase text-xs tracking-widest mt-1" id="day-display">SYSTEM ONLINE</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-xl font-bold text-sm transition shadow-lg">+ NEW TEACHER</button>
                    <button onclick="document.getElementById('csv-file').click()" class="bg-slate-800 hover:bg-slate-700 px-5 py-2.5 rounded-xl font-bold text-sm border border-slate-700">IMPORT CSV</button>
                    <input type="file" id="csv-file" accept=".csv" class="hidden" onchange="uploadCSV(event)">
                    <button onclick="location.reload()" class="p-2.5 bg-slate-900 rounded-xl border border-slate-800 text-gray-500">LOGOUT</button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-5 glass rounded-3xl p-6 h-[75vh] flex flex-col">
                    <h3 class="text-lg font-black text-gray-300 mb-6">STAFF DIRECTORY</h3>
                    <div id="staff-list" class="space-y-3 overflow-y-auto custom-scroll pr-2 flex-grow"></div>
                </div>

                <div class="lg:col-span-7 glass rounded-3xl p-6 h-[75vh] flex flex-col border-cyan-900/20 shadow-[0_0_50px_-12px_rgba(34,211,238,0.1)]">
                    <h3 class="text-lg font-black text-cyan-400 mb-6 flex items-center gap-2">LIVE AI SUGGESTIONS</h3>
                    <div id="ai-list" class="space-y-4 overflow-y-auto custom-scroll pr-2 flex-grow"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="glass w-full max-w-2xl rounded-3xl p-8 max-h-[90vh] overflow-y-auto border-white/10 shadow-2xl">
            <h2 id="modal-title" class="text-2xl font-black text-cyan-400 mb-6 uppercase">Faculty Record</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="text-[10px] text-gray-500 font-bold uppercase">Name</label>
                    <input type="text" id="t-name" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1 text-white">
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 font-bold uppercase">Wing</label>
                    <select id="t-wing" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1 text-white">
                        <option>Senior</option>
                        <option>Primary</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 font-bold uppercase">Proxy Allowed?</label>
                    <select id="t-proxy" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1 text-white">
                        <option value="true">YES - Available for Proxy</option>
                        <option value="false">NO - Rule 2 Exempt</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-gray-500 font-bold uppercase">Class Teacher Of</label>
                    <input type="text" id="t-class" placeholder="10-B" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl mt-1 text-white">
                </div>
            </div>

            <div class="flex justify-between items-center mb-4">
                <h4 class="text-xs font-black text-gray-500 uppercase">Routine / Free Slots</h4>
                <button onclick="addScheduleRow()" class="text-cyan-500 text-xs font-bold">+ ADD SLOT</button>
            </div>
            <div id="schedule-container" class="space-y-2"></div>

            <div class="flex gap-4 mt-10">
                <button onclick="saveTeacher()" class="flex-grow bg-cyan-500 py-4 rounded-2xl font-black text-black uppercase tracking-tighter">Save to Cloud</button>
                <button onclick="closeModal()" class="bg-slate-800 px-8 rounded-2xl font-bold">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://cfxobkfkhlirxepxvxjr.supabase.co'; 
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmeG9ia2ZraGxpcnhlcHh2eGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTI2NDUsImV4cCI6MjA5Mjg4ODY0NX0.spKXqpRScu3U7uiMnoA0iEJkiLf68RxGZya07WRlakg';
        const _db = supabase.createClient(SB_URL, SB_KEY);
        
        const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const today = days[new Date().getDay()];
        let editingTeacherId = null;

        // --- AUTHENTICATION ---
        function checkAuth() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin123') {
                document.getElementById('auth-overlay').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('day-display').innerText = `ROUTINE STATUS: ${today.toUpperCase()}`;
                refresh();
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
            }
        }

        // --- DATA LOAD ---
        async function refresh() {
            const { data: teachers } = await _db.from('teachers').select('*').order('name');
            renderStaff(teachers || []);
            processAI(teachers || []);
        }

        function renderStaff(list) {
            document.getElementById('staff-list').innerHTML = list.map(t => `
                <div class="bg-slate-900/40 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                    <div>
                        <div class="font-bold text-gray-200">${t.name}</div>
                        <div class="text-[10px] font-bold text-slate-500 uppercase mt-1">
                            ${t.wing} | Load: ${t.proxy_count} | ${t.can_take_proxy ? 'ELIGIBLE' : 'RULE 2 EXEMPT'}
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openEditModal('${t.id}')" class="px-3 py-2 bg-slate-800 rounded-lg text-[10px] font-bold hover:bg-slate-700">EDIT</button>
                        <button onclick="toggleAbsence('${t.id}', ${t.is_absent})" class="px-3 py-2 rounded-lg text-[10px] font-black ${t.is_absent ? 'bg-red-500/20 text-red-500 border border-red-500/30' : 'bg-slate-800 text-slate-400'}">
                            ${t.is_absent ? 'ABSENT' : 'MARK ABSENT'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // --- EDIT LOGIC ---
        async function openEditModal(id) {
            editingTeacherId = id;
            document.getElementById('modal-title').innerText = "Edit Faculty Record";
            const { data: t } = await _db.from('teachers').select('*').eq('id', id).single();
            
            document.getElementById('t-name').value = t.name;
            document.getElementById('t-wing').value = t.wing;
            document.getElementById('t-proxy').value = t.can_take_proxy.toString();
            document.getElementById('t-class').value = t.ct_class || '';

            // Load Existing Schedule
            document.getElementById('schedule-container').innerHTML = '';
            const { data: busy } = await _db.from('teacher_schedule').select('*').eq('teacher_id', id);
            const { data: free } = await _db.from('free_periods').select('*').eq('teacher_id', id);
            
            busy?.forEach(r => addScheduleRow(r.day_of_week, r.period_number, 'busy', r.class_name));
            free?.forEach(r => addScheduleRow(r.day_of_week, r.period_number, 'free', ''));

            document.getElementById('modal').classList.remove('hidden');
        }

        function addScheduleRow(d='Monday', p='', type='busy', c='') {
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-slate-800/20 p-2 rounded-xl border border-slate-800";
            div.innerHTML = `
                <select class="r-day bg-slate-900 text-[10px] p-2 rounded outline-none flex-grow">
                    ${days.filter(day => day !== 'Sunday').map(day => `<option ${day===d?'selected':''}>${day}</option>`).join('')}
                </select>
                <input type="number" value="${p}" class="r-prd w-12 bg-slate-900 p-2 rounded text-center text-[10px]" placeholder="Prd">
                <select class="r-type bg-slate-900 p-2 rounded text-[10px]">
                    <option value="busy" ${type==='busy'?'selected':''}>BUSY</option>
                    <option value="free" ${type==='free'?'selected':''}>FREE</option>
                </select>
                <input type="text" value="${c}" class="r-cls w-16 bg-slate-900 p-2 rounded text-[10px]" placeholder="Class">
                <button onclick="this.parentElement.remove()" class="text-red-500 px-2 font-bold">×</button>
            `;
            document.getElementById('schedule-container').appendChild(div);
        }

        async function saveTeacher() {
            const name = document.getElementById('t-name').value;
            const wing = document.getElementById('t-wing').value;
            const canProxy = document.getElementById('t-proxy').value === 'true';
            const cls = document.getElementById('t-class').value;

            let tId = editingTeacherId;
            if(editingTeacherId) {
                await _db.from('teachers').update({ name, wing, can_take_proxy: canProxy, ct_class: cls }).eq('id', tId);
                // Wipe old schedule to re-insert new
                await _db.from('teacher_schedule').delete().eq('teacher_id', tId);
                await _db.from('free_periods').delete().eq('teacher_id', tId);
            } else {
                const { data: newT } = await _db.from('teachers').insert({ name, wing, can_take_proxy: canProxy, ct_class: cls }).select().single();
                tId = newT.id;
            }

            const rows = document.querySelectorAll('#schedule-container > div');
            for(let row of rows) {
                const dayVal = row.querySelector('.r-day').value;
                const prdVal = row.querySelector('.r-prd').value;
                const typeVal = row.querySelector('.r-type').value;
                const clsVal = row.querySelector('.r-cls').value;

                if(prdVal) {
                    if(typeVal === 'busy') await _db.from('teacher_schedule').insert({ teacher_id: tId, day_of_week: dayVal, period_number: prdVal, class_name: clsVal });
                    else await _db.from('free_periods').insert({ teacher_id: tId, day_of_week: dayVal, period_number: prdVal });
                }
            }
            closeModal();
            refresh();
        }

        // --- AI ENGINE & OTHER UTILS ---
        async function processAI(all) {
            const container = document.getElementById('ai-list');
            const absentees = all.filter(t => t.is_absent);
            if (absentees.length === 0) {
                container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-800 py-20 border-2 border-dashed border-slate-900 rounded-3xl"><p class="font-black text-lg">SYSTEM READY. NO ABSENCES.</p></div>`;
                return;
            }

            let html = "";
            for (let abs of absentees) {
                const { data: schedule } = await _db.from('teacher_schedule').select('*').eq('teacher_id', abs.id).eq('day_of_week', today);
                for (let slot of (schedule || [])) {
                    const { data: freeData } = await _db.from('free_periods').select('teacher_id, teachers(*)').eq('day_of_week', today).eq('period_number', slot.period_number);
                    let candidates = freeData?.map(f => f.teachers).filter(t => t && !t.is_absent && t.can_take_proxy) || [];
                    candidates.sort((a, b) => {
                        let scoreA = (a.wing === abs.wing ? 100 : 0) - (a.proxy_count * 10);
                        let scoreB = (b.wing === abs.wing ? 100 : 0) - (b.proxy_count * 10);
                        return scoreB - scoreA;
                    });
                    const m = candidates[0];
                    html += `
                        <div class="bg-slate-900/60 border ${m ? 'border-cyan-900/30' : 'border-red-900/30'} p-5 rounded-3xl">
                            <div class="flex justify-between mb-4">
                                <div><span class="text-[10px] text-cyan-400 font-black">PERIOD ${slot.period_number}</span><h4 class="text-xl font-black">${slot.class_name}</h4></div>
                                <div class="text-right text-red-400 text-xs font-bold uppercase">Absent: ${abs.name}</div>
                            </div>
                            <div class="p-4 rounded-2xl bg-white/5 border border-white/5">
                                ${m ? `<div class="flex justify-between items-center"><div class="font-black text-green-400">${m.name} <span class="text-[10px] text-slate-500 block">Wing: ${m.wing} | Load: ${m.proxy_count}</span></div><button onclick="confirmProxy('${m.id}')" class="bg-cyan-500 text-black px-4 py-2 rounded-lg font-black text-xs">CONFIRM</button></div>` : `<div class="text-red-500 font-black">NO STAFF AVAILABLE</div>`}
                            </div>
                        </div>`;
                }
            }
            container.innerHTML = html;
        }

        async function confirmProxy(id) {
            const { data } = await _db.from('teachers').select('proxy_count').eq('id', id).single();
            await _db.from('teachers').update({ proxy_count: (data.proxy_count || 0) + 1 }).eq('id', id);
            alert("Proxy confirmed. Load updated.");
            refresh();
        }

        async function toggleAbsence(id, cur) { await _db.from('teachers').update({ is_absent: !cur }).eq('id', id); refresh(); }
        function openModal() { editingTeacherId = null; document.getElementById('modal-title').innerText = "New Faculty Record"; document.getElementById('modal').classList.remove('hidden'); addScheduleRow(); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('schedule-container').innerHTML = ''; }
    </script>
</body>
</html>
